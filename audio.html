    <!-- 

    idea:
    prompt: 
    'crea un sketch con p5.js para tipografía audio reactiva

    Texto: "p5.js Prompt LAB"
    Define variables para controlar texto, tamaño, color y tipografía
    Audio:
    Carga el audio del archivo "./audio/frase.mp3"
    
    Divide el audio en 'n' frecuencias y asigna frecuencias promedio a cada letra del texto.
    Reproduce el audio al click en pantalla y lee el audio, para obtener el valor de frecuencia de cada letra.
    
    Dibuja el texto/palabras en pantalla, y por cada valor de frecuencia, ajusta
    ligeramente la escala según su valor de frecuencia,
    con el tamaño de tipografía definido en la variable de tamaño.
    -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
